# Example deployment: fb2cng-web with optional OIDC authentication.
# See docs/oidc-authelia.md for setup.
services:
  fb2cng-web:
    build: .
    environment:
      # Optional OIDC auth (see docs/oidc-authelia.md):
      # AUTH_MODE: "oidc"
      # AUTH_OIDC_ISSUER: "https://auth.example.com"
      # AUTH_OIDC_CLIENT_ID: "fb2cng"
      # AUTH_OIDC_CLIENT_SECRET: "<plaintext secret>"
      # AUTH_OIDC_REDIRECT_URL: "https://fb2cng.example.com/auth/callback"
      # AUTH_OIDC_REQUIRED_GROUP: "fb2cng-users"
      # AUTH_SESSION_KEY: "<base64 32 bytes>"
      PRESETS_DIR: /data/presets
      JOBS_DIR: /tmp/fb2cng-jobs
    volumes:
      - presets:/data/presets      # persistent named preset store
    # Optional: only needed if you run with a read-only root filesystem.
    # The hardened base already ships a writable /tmp, so conversions work without this.
    tmpfs:
      - /tmp:rw,mode=1777          # jobs scratch (swept on TTL)
    expose:
      - "8080"

  authelia:
    image: authelia/authelia:4
    volumes:
      - ./authelia:/config
    expose:
      - "9091"

  caddy:
    image: caddy:2
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - fb2cng-web
      - authelia

volumes:
  presets:
