# Optional turnkey deployment: fb2cng-web behind Caddy + Authelia forward-auth.
# The app is NOT published directly — only Caddy is. fb2cng-web trusts Remote-*
# headers; AUTH_FORWARD_AUTH gates access. Adjust domains/secrets before use.
services:
  fb2cng-web:
    build: .
    environment:
      AUTH_FORWARD_AUTH: "true"
      TRUSTED_PROXIES: ""   # optional: set to caddy's container IP for defense-in-depth
      PRESETS_DIR: /data/presets
      JOBS_DIR: /tmp/fb2cng-jobs
    volumes:
      - presets:/data/presets      # persistent named preset store
    # Optional: only needed if you run with a read-only root filesystem.
    # The hardened base already ships a writable /tmp, so conversions work without this.
    tmpfs:
      - /tmp:rw,mode=1777          # jobs scratch (swept on TTL)
    expose:
      - "8080"
    # No "ports:" — never expose the app directly when auth is on.

  authelia:
    image: authelia/authelia:4
    volumes:
      - ./authelia:/config
    expose:
      - "9091"

  caddy:
    image: caddy:2
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - fb2cng-web
      - authelia

volumes:
  presets:
