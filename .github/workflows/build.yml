name: build
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Safety net: a push to main may carry code that never went through the local
      # lefthook bump (GitHub merge/squash button, or a contributor without the hook).
      # Diff the push range and bump VERSION here if it wasn't already bumped. The
      # bump-version.sh guard skips when VERSION is already in the diff (local path),
      # so this only fires when the local hook didn't. The token-authored push does
      # not retrigger workflows, so there is no loop.
      - name: Auto-bump VERSION for un-bumped code on main
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="HEAD~1..HEAD"
          else
            range="${BEFORE}..${AFTER}"
          fi
          changed="$(git diff --name-only "$range")"
          CHANGED_FILES="$changed" NO_GIT_ADD=1 bash scripts/bump-version.sh
          if ! git diff --quiet HEAD -- VERSION; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "chore: bump VERSION to $(cat VERSION) [skip ci]"
            git push origin HEAD:main
          fi

      - id: ver
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "fbc=$(cat FBC_VERSION)" >> "$GITHUB_OUTPUT"
      - id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fb2cng-web" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-and-push
        with:
          image: ${{ steps.img.outputs.image }}
          version: ${{ steps.ver.outputs.version }}
          fbc_version: ${{ steps.ver.outputs.fbc }}
          token: ${{ secrets.GITHUB_TOKEN }}
