name: fbc-update
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  pull-requests: write
  statuses: write
concurrency:
  group: fbc-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: check
        run: bash scripts/fbc-check.sh

      # main is protected by the require-version-bump ruleset, so the bot cannot
      # push to it directly. Open a PR instead. The bot's own GITHUB_TOKEN cannot
      # trigger version-guard on that PR (GitHub suppresses workflow runs from
      # token-authored events), so we self-report the required "version-bump"
      # status: an FBC_VERSION-only change never owes a VERSION bump, which is
      # exactly what version-guard would conclude. Auto-merge lands it once the
      # status is green. The image is still built in this job (below) because the
      # token-driven merge likewise will not trigger build.yml.
      - name: Open PR for bumped FBC_VERSION
        if: steps.check.outputs.changed == 'true'
        env:
          FBC_VER: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="fbc-bump-${FBC_VER}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add FBC_VERSION
          git commit -m "chore: bump fbc to ${FBC_VER}"
          # The bot solely owns fbc-bump-* branches; force past any leftover from
          # a prior failed run (a fresh runner has no tracking ref for --lease).
          git push --force origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "chore: bump fbc to ${FBC_VER}" \
            --body "Automated fbc bump to ${FBC_VER}. FBC_VERSION-only change; no VERSION bump owed."
          SHA="$(git rev-parse HEAD)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=success \
            -f context=version-bump \
            -f description="FBC_VERSION-only change; no VERSION bump owed"
          gh pr merge "$BR" --auto --squash --delete-branch

      - id: ver
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "fbc=$(cat FBC_VERSION)" >> "$GITHUB_OUTPUT"

      - id: img
        if: steps.check.outputs.changed == 'true'
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fb2cng-web" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-and-push
        if: steps.check.outputs.changed == 'true'
        with:
          image: ${{ steps.img.outputs.image }}
          version: ${{ steps.ver.outputs.version }}
          fbc_version: ${{ steps.ver.outputs.fbc }}
          token: ${{ secrets.GITHUB_TOKEN }}
